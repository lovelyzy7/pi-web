name: Demo

# Builds the static Pi Web demo in demo/ and publishes it to GitHub Pages.
# Pull requests that touch the demo only build it.
#
# Two one-time repository settings are needed, and both are off by default on a
# fork — a workflow that only fails does not explain either of them:
#   1. Settings → Actions → General → "Allow all actions" (on a fork GitHub
#      disables workflows entirely until this is confirmed).
#   2. Nothing for Pages: `configure-pages` with `enablement: true` turns the
#      Pages site on with "GitHub Actions" as its source on the first run.
# docs/release.md repeats this in prose.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "demo/**"
      - "package.json"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

# `pages: write` + `id-token: write` are what the Pages deployment needs, and
# `configure-pages` needs them as well — with only `contents: read` it fails with
# "Resource not accessible by integration" before the build even starts.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site (source: GitHub Actions) when it does not
          # exist yet, so a fresh fork publishes on its first run.
          enablement: true
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # "/<repo>" for a project site, empty for a custom domain.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
